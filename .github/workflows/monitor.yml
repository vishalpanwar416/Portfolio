name: Monitor sites

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src/admin/projects.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - name: Check sites
        run: node scripts/monitor.mjs
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_EXTRA_HOSTS: ${{ vars.MONITOR_EXTRA_HOSTS }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}
